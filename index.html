<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simuleer vermogensopbouw via beleggen en sparen – volledig in je browser." />
    <title>Vermogensplanner</title>
    <script>
      // Zet het thema vóór de eerste render om een 'flash' te voorkomen.
      (function () {
        try {
          var m = JSON.parse(localStorage.getItem('vermogensplanner.theme') || '"system"');
          var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
